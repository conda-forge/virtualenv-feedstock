schema_version: 1

context:
  name: virtualenv
  version: "21.15.7"

package:
  name: virtualenv
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/virtualenv-${{ version }}.tar.gz
  sha256: d8c9b23a031c579569159dee7b3f514dd79824ecf1d9201c6e7825cd2abc3a09

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - virtualenv = virtualenv.__main__:run_with_catch

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatch-fancy-pypi-readme >=25.1
    - hatch-vcs >=0.5
    # python-sbom[hatch]
    - hatchling >=1.28
    - python-sbom >=0.1.2
  run:
    - python >=${{ python_min }}
    - distlib >=0.4.3,<1
    - filelock >=3.24.2,<5
    - packaging >=26.3
    - platformdirs >=4.4,<5
    - python-discovery >=1.6.1

tests:
  - python:
      imports:
        - virtualenv
        - virtualenv.activation
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
    script:
      - virtualenv --help

about:
  summary: Virtual Python Environment builder
  license: MIT
  license_file: LICENSE
  description: |
    A tool for creating isolated virtual python environments.
  homepage: https://virtualenv.pypa.io/
  repository: https://github.com/pypa/virtualenv
  documentation: https://virtualenv.pypa.io/en/latest/

extra:
  recipe-maintainers:
    - mingwandroid
    - kalefranz
    - xylar

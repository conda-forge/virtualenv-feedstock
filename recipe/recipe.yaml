schema_version: 1

context:
  name: virtualenv
  version: "21.7.9"

package:
  name: virtualenv
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/virtualenv-${{ version }}.tar.gz
  sha256: a7e42d81d779dec8afd7dc4be71640fb959ea861bccfa5980cb4ad9f92e30675

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - virtualenv = virtualenv.__main__:run_with_catch

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatch-vcs >=0.4
    - hatchling >=1.27
  run:
    - python >=${{ python_min }}
    - distlib >=0.3.7,<1
    # tightest of upstream's floors (python >=3.10)
    - filelock >=3.24.2,<4
    - platformdirs >=3.9.1,<5
    - python-discovery >=1.6
    # tightest of upstream's floors (python <3.11)
    - typing_extensions >=4.13.2

tests:
  - python:
      imports:
        - virtualenv
        - virtualenv.activation
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
    script:
      - virtualenv --help

about:
  summary: Virtual Python Environment builder
  license: MIT
  license_file: LICENSE
  description: |
    A tool for creating isolated virtual python environments.
  homepage: https://virtualenv.pypa.io/
  repository: https://github.com/pypa/virtualenv
  documentation: https://virtualenv.pypa.io/en/latest/

extra:
  recipe-maintainers:
    - mingwandroid
    - kalefranz
    - xylar

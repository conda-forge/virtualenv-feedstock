schema_version: 1

context:
  name: virtualenv
  version: "21.10.0"

package:
  name: virtualenv
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/virtualenv-${{ version }}.tar.gz
  sha256: 7416cbc176d8a06b0c71e2bf65745b00822a5c204df9a2473b91d8fd06e4f6fd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - virtualenv = virtualenv.__main__:run_with_catch

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatch-vcs >=0.4
    - hatchling >=1.28
  run:
    - python >=${{ python_min }}
    - distlib >=0.3.7,<1
    - filelock >=3.24.2,<4
    - platformdirs >=3.9.1,<5
    - python-discovery >=1.6

tests:
  - python:
      imports:
        - virtualenv
        - virtualenv.activation
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
    script:
      - virtualenv --help

about:
  summary: Virtual Python Environment builder
  license: MIT
  license_file: LICENSE
  description: |
    A tool for creating isolated virtual python environments.
  homepage: https://virtualenv.pypa.io/
  repository: https://github.com/pypa/virtualenv
  documentation: https://virtualenv.pypa.io/en/latest/

extra:
  recipe-maintainers:
    - mingwandroid
    - kalefranz
    - xylar
